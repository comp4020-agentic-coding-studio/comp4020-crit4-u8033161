<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Six strings</title>
    <meta
      name="description"
      content="A pluckable six-string instrument tuned to C major pentatonic — every combination stays consonant."
    />

    <!--
      The link-preview card: public/card.png, 1200x630 --- replace it. The URL
      resolves against this page, like any link. No og:title/og:description:
      scrapers fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <h1>Six strings</h1>
      <div class="fretboard" data-testid="fretboard">
        <button type="button" class="string" data-note="C3" data-key="a" aria-label="String 1, C3, key A"></button>
        <button type="button" class="string" data-note="D3" data-key="s" aria-label="String 2, D3, key S"></button>
        <button type="button" class="string" data-note="E3" data-key="d" aria-label="String 3, E3, key D"></button>
        <button type="button" class="string" data-note="G3" data-key="f" aria-label="String 4, G3, key F"></button>
        <button type="button" class="string" data-note="A3" data-key="j" aria-label="String 5, A3, key J"></button>
        <button type="button" class="string" data-note="C4" data-key="k" aria-label="String 6, C4, key K"></button>
      </div>
      <p class="hint">drag a string, or press <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> <kbd>F</kbd> <kbd>J</kbd> <kbd>K</kbd></p>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
