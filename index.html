<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Six strings</title>
    <meta
      name="description"
      content="A pluckable six-string instrument tuned to C major pentatonic — every combination stays consonant."
    />

    <!--
      The link-preview card: public/card.png, 1200x630 --- replace it. The URL
      resolves against this page, like any link. No og:title/og:description:
      scrapers fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <h1>Six strings</h1>
      <div class="fretboard" data-testid="fretboard">
        <div class="string-col">
          <button type="button" class="string" data-note="C3" data-key="a" aria-label="String 1, C3, key A"></button>
          <span class="key-label" aria-hidden="true">A</span>
        </div>
        <div class="string-col">
          <button type="button" class="string" data-note="D3" data-key="s" aria-label="String 2, D3, key S"></button>
          <span class="key-label" aria-hidden="true">S</span>
        </div>
        <div class="string-col">
          <button type="button" class="string" data-note="E3" data-key="d" aria-label="String 3, E3, key D"></button>
          <span class="key-label" aria-hidden="true">D</span>
        </div>
        <div class="string-col">
          <button type="button" class="string" data-note="G3" data-key="f" aria-label="String 4, G3, key F"></button>
          <span class="key-label" aria-hidden="true">F</span>
        </div>
        <div class="string-col">
          <button type="button" class="string" data-note="A3" data-key="j" aria-label="String 5, A3, key J"></button>
          <span class="key-label" aria-hidden="true">J</span>
        </div>
        <div class="string-col">
          <button type="button" class="string" data-note="C4" data-key="k" aria-label="String 6, C4, key K"></button>
          <span class="key-label" aria-hidden="true">K</span>
        </div>
      </div>
      <div class="fretboard" data-testid="fretboard-octave-2">
        <div class="string-col">
          <button type="button" class="string" data-note="C4" data-key="q" aria-label="String 7, C4, one octave up, key Q"></button>
          <span class="key-label" aria-hidden="true">Q</span>
        </div>
        <div class="string-col">
          <button type="button" class="string" data-note="D4" data-key="w" aria-label="String 8, D4, one octave up, key W"></button>
          <span class="key-label" aria-hidden="true">W</span>
        </div>
        <div class="string-col">
          <button type="button" class="string" data-note="E4" data-key="e" aria-label="String 9, E4, one octave up, key E"></button>
          <span class="key-label" aria-hidden="true">E</span>
        </div>
        <div class="string-col">
          <button type="button" class="string" data-note="G4" data-key="r" aria-label="String 10, G4, one octave up, key R"></button>
          <span class="key-label" aria-hidden="true">R</span>
        </div>
        <div class="string-col">
          <button type="button" class="string" data-note="A4" data-key="u" aria-label="String 11, A4, one octave up, key U"></button>
          <span class="key-label" aria-hidden="true">U</span>
        </div>
        <div class="string-col">
          <button type="button" class="string" data-note="C5" data-key="i" aria-label="String 12, C5, one octave up, key I"></button>
          <span class="key-label" aria-hidden="true">I</span>
        </div>
      </div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
